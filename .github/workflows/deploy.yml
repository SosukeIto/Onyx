# Build the static vault bundle + the TanStack Start app and deploy to
# Cloudflare Workers.
#
# Onyx is a public repository, so Actions minutes are free and unlimited:
#   - push to main      : Onyx のコード変更 → 常にビルド・デプロイ
#   - schedule (15 min) : my-vault の HEAD を確認し、前回デプロイ時から変わっていればビルド・デプロイ
#   - workflow_dispatch : 手動(force=true で変更が無くてもデプロイ)
#
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 変更が無くてもデプロイする
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  VAULT_REPO: SosukeIto/my-vault
  VAULT_BRANCH: main

jobs:
  # my-vault の HEAD と Onyx の HEAD を合わせたキーで「デプロイ済みか」を判定する。
  # 定期実行で両方とも前回と同じならビルドしない(Cloudflare への無駄なデプロイを避ける)。
  check:
    runs-on: ubuntu-latest
    outputs:
      vault_sha: ${{ steps.vault.outputs.sha }}
      deploy: ${{ steps.decide.outputs.deploy }}
      key: ${{ steps.decide.outputs.key }}
    steps:
      - id: vault
        run: echo "sha=$(git ls-remote https://github.com/${VAULT_REPO}.git refs/heads/${VAULT_BRANCH} | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: deployed-${{ github.sha }}-${{ steps.vault.outputs.sha }}
          lookup-only: true
      - id: decide
        run: |
          key="deployed-${{ github.sha }}-${{ steps.vault.outputs.sha }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ inputs.force }}" = "true" ] || [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout my-vault
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VAULT_REPO }}
          ref: ${{ needs.check.outputs.vault_sha }}
          path: data/vault
          # 全履歴: ノートごとの更新日を git log から取るため
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build vault bundle
        run: bun run build:vault
        env:
          VAULT_DIR: data/vault
          OUT_DIR: apps/web/public
          VAULT_BRANCH: ${{ env.VAULT_BRANCH }}

      - name: Build web
        run: bun run build

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply onyx-db --remote
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: bunx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Mark as deployed
        run: echo "${{ needs.check.outputs.key }}" > .deployed
      - uses: actions/cache/save@v4
        with:
          path: .deployed
          key: ${{ needs.check.outputs.key }}
