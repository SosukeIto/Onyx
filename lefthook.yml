# https://lefthook.dev/configuration/
# `bunx lefthook install` で .git/hooks に登録される。
# git フックは非対話シェルで走り ~/.zshrc を読まないため、コマンド側で Bun の PATH を通す。
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: PATH="$HOME/.bun/bin:$PATH" bunx vp lint

    - name: format
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc,css,md}"
      run: PATH="$HOME/.bun/bin:$PATH" bunx vp fmt --check
